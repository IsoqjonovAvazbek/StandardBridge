{% extends 'base.html' %}
{% block title %}Taklifnoma tahrirlash{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6">
        <a href="{% url 'proposal_detail' proposal.pk %}" class="text-blue-600 hover:underline text-sm">← Taklifnoma</a>
        <h1 class="text-2xl font-bold text-gray-900 mt-1">Taklifnomani tahrirlash</h1>
    </div>

    <form method="POST" class="space-y-5">
        {% csrf_token %}
        <div class="grid grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Narx min ($)</label>
                <input type="number" name="price_min" value="{{ proposal.price_min|floatformat:0 }}" min="0"
                    class="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Narx max ($)</label>
                <input type="number" name="price_max" value="{{ proposal.price_max|floatformat:0 }}" min="0"
                    class="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Muddat (kun)</label>
                <input type="number" name="duration_days" value="{{ proposal.duration_days }}" min="1"
                    class="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Holat</label>
            <select name="status" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="draft" {% if proposal.status == 'draft' %}selected{% endif %}>Qoralama</option>
                <option value="sent" {% if proposal.status == 'sent' %}selected{% endif %}>Yuborilgan</option>
                <option value="accepted" {% if proposal.status == 'accepted' %}selected{% endif %}>Qabul qilindi</option>
                <option value="rejected" {% if proposal.status == 'rejected' %}selected{% endif %}>Rad etildi</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Matn (Markdown formatida)</label>
            <textarea name="content" rows="20"
                class="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none resize-y font-mono text-xs"
                >{{ proposal.content }}</textarea>
            <p class="text-xs text-gray-400 mt-1">**qalin**, ## sarlavha, - ro'yxat</p>
        </div>
        <div class="flex gap-3">
            <a href="{% url 'proposal_detail' proposal.pk %}"
               class="flex-1 border border-gray-300 text-gray-700 py-2.5 rounded-xl text-sm text-center hover:bg-gray-50 transition">
                Bekor
            </a>
            <button type="submit" class="flex-1 gradient-bg text-white py-2.5 rounded-xl text-sm font-medium hover:opacity-90 transition">
                Saqlash
            </button>
        </div>
    </form>
</div>
{% endblock %}
