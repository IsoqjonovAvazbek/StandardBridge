<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarmoq yo'q — StandardBridge</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #042C53, #378ADD);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 36px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
        }
        p {
            font-size: 15px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #042C53, #378ADD);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .hint {
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }
        .logo {
            margin-top: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 13px;
        }
        .logo-mark {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: linear-gradient(135deg, #042C53, #378ADD);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Internet aloqasi yo'q</h1>
        <p>Tarmoqqa ulanish imkoni bo'lmadi.<br>
        Internet aloqangizni tekshiring va qayta urinib ko'ring.</p>
        <button class="btn" onclick="window.location.reload()">Qayta urinish</button>
        <p class="hint">Yoki <a href="/" style="color:#378ADD;text-decoration:none;">bosh sahifaga</a> qaytishingiz mumkin.</p>
        <div class="logo">
            <div class="logo-mark">SB</div>
            StandardBridge
        </div>
    </div>
</body>
</html>
