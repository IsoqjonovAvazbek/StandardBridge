<div class="w-64 bg-white border-r border-gray-200 flex flex-col fixed h-full top-16 z-40">
    <div class="p-6 border-b border-gray-100">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full gradient-bg flex items-center justify-center flex-shrink-0">
                <span class="text-white font-bold text-lg">
                    {{ request.user.first_name|first }}{{ request.user.last_name|first }}
                </span>
            </div>
            <div>
                <p class="font-bold text-gray-900 text-sm">{{ request.user.get_full_name }}</p>
                <p class="text-gray-500 text-xs">Mutaxassis</p>
            </div>
        </div>
        {% if request.user.wallet %}
        <div class="mt-4 bg-gray-50 rounded-xl p-3">
            <p class="text-xs text-gray-500">Balans</p>
            <p class="font-bold text-gray-900 text-lg">${{ request.user.wallet.balance }}</p>
        </div>
        {% endif %}
        
    </div>
    <nav class="flex-1 p-4 space-y-1">
        <a href="{% url 'expert_dashboard' %}"
            class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm
            {% if request.resolver_match.url_name == 'expert_dashboard' %}gradient-bg text-white{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            Dashboard
        </a>
        <a href="{% url 'project_list' %}"
            class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm
            {% if request.resolver_match.url_name == 'project_list' %}gradient-bg text-white{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            Loyihalar
        </a>
        <a href="{% url 'wallet' %}"
            class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm
            {% if request.resolver_match.url_name == 'wallet' %}gradient-bg text-white{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
            Hamyon
        </a>
        <a href="{% url 'notifications' %}"
            class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm
            {% if request.resolver_match.url_name == 'notifications' %}gradient-bg text-white{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            Bildirishnomalar
        </a>
        <a href="{% url 'expert_profile' %}"
            class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm
            {% if request.resolver_match.url_name == 'expert_profile' %}gradient-bg text-white{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            Profil
        </a>
    </nav>
</div>
